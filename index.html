<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Manager</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
    .container { max-width: 520px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .header .icon { font-size: 26px; }
    .header h1 { font-size: 22px; margin: 0; color: #222; font-weight: 700; }
    .header .room { color: #0d6efd; font-weight: 700; margin-left: 4px; }
    .total { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 8px; }
    .stats { background: #fff8c5; border: 1px solid #f0e68c; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 10px; }
    .stats .add { color: #2e7d32; font-weight: 700; }
    .stats .dup { color: #c62828; font-weight: 700; }
    .stats .other { color: #c62828; font-weight: 700; }
    .stats .sep { color: #999; margin: 0 4px; }
    textarea { width: 100%; height: 170px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 13px; background: white; resize: vertical; display: block; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-row button { padding: 8px 18px; border: none; border-radius: 4px; font-weight: 600; font-size: 14px; cursor: pointer; color: white; }
    .btn-add { background: #0d6efd; }
    .btn-add:hover { background: #0b5ed7; }
    .btn-clear { background: #dc3545; }
    .btn-clear:hover { background: #bb2d3b; }
    .btn-file { background: #0d6efd; }
    .btn-file:hover { background: #0b5ed7; }
    .copy-btn { width: 100%; background: #0d6efd; color: white; padding: 22px; border: none; border-radius: 6px; font-size: 20px; font-weight: 700; margin-top: 18px; cursor: pointer; letter-spacing: 0.5px; }
    .copy-btn:hover { background: #0b5ed7; }
    .copy-btn:active { transform: scale(0.99); }
    .home-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
    .home-btn { width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .hidden { display: none !important; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 22px; border-radius: 25px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; text-align: center; word-break: break-all; }
    .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH NHẬP PHÒNG -->
    <div id="homeView" class="hidden">
        <div class="header">
            <span class="icon">📬</span>
            <h1>Mail Manager</h1>
        </div>
        <p style="color:#666; font-size:14px;">Nhập tên phòng để truy cập:</p>
        <input type="text" class="home-input" id="roomInput" placeholder="VD: Thoan2000">
        <button class="home-btn" onclick="goToRoom()">VÀO PHÒNG</button>
    </div>

    <!-- MÀN HÌNH CHÍNH -->
    <div id="mainView" class="hidden">
        <div class="header">
            <span class="icon">📬</span>
            <h1>Mail Manager<span class="room" id="roomName"></span></h1>
        </div>

        <div class="total" id="totalMail">Số mail: 0</div>

        <div class="stats">
            <span class="add">✅ Thêm: <span id="statAdd">0</span></span>
            <span class="sep">|</span>
            <span class="dup">❌ Trùng: <span id="statDup">0</span></span>
            <span class="sep">|</span>
            <span class="other">❌ Mail khác hệ thống: <span id="statOther">0</span></span>
        </div>

        <textarea id="mailInput" placeholder="Dán danh sách mail vào đây, mỗi dòng 1 mail..."></textarea>

        <div class="btn-row">
            <button class="btn-add" onclick="addMails()">Add</button>
            <button class="btn-clear" onclick="clearAll()">❌ Xóa tất cả</button>
            <button class="btn-file" onclick="document.getElementById('fileInput').click()">📄 Tải file</button>
        </div>
        <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="loadFile(event)">

        <button class="copy-btn" onclick="copyMail()">✏️ COPY MAIL</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAFTBub56US4pY2NhZIB9s3XGPktd4VKko",
        authDomain: "mail-manager-620f4.firebaseapp.com",
        databaseURL: "https://mail-manager-620f4-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "mail-manager-620f4",
        storageBucket: "mail-manager-620f4.firebasestorage.app",
        messagingSenderId: "1093473633575",
        appId: "1:1093473633575:web:556ed50c43e5fda06ad502"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = "";
    let currentAccounts = [];
    let currentCounter = 0;
    let stats = { added: 0, duplicate: 0, other: 0 };
    let currentMail = "";
    let assigning = false;

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        clearTimeout(t._tm);
        t._tm = setTimeout(() => t.classList.remove("show"), 2200);
    }

    // ============================================================
    // ĐIỀU HƯỚNG
    // ============================================================
    function getRoom() {
        return window.location.hash.replace("#", "").trim();
    }

    function init() {
        const room = getRoom();
        if (!room) {
            document.getElementById("homeView").classList.remove("hidden");
            document.getElementById("mainView").classList.add("hidden");
        } else {
            document.getElementById("homeView").classList.add("hidden");
            document.getElementById("mainView").classList.remove("hidden");
            document.getElementById("roomName").innerText = " " + room;
            currentRoom = room;
            loadRoom(room);
        }
    }

    function goToRoom() {
        const r = document.getElementById("roomInput").value.trim();
        if (!r) { alert("Vui lòng nhập tên phòng!"); return; }
        window.location.hash = r;
        init();
    }

    // ============================================================
    // TẢI DỮ LIỆU PHÒNG
    // ============================================================
    function loadRoom(room) {
        db.ref("rooms/" + room).on("value", (snap) => {
            const data = snap.val() || { accounts: [], counter: 0 };
            currentAccounts = data.accounts || [];
            currentCounter = data.counter || 0;
            document.getElementById("totalMail").innerText = "Số mail: " + currentAccounts.length;
            assignMailToDevice();
        });
    }

    // ============================================================
    // CẤP MAIL CHO THIẾT BỊ NÀY (tự phục hồi nếu slot lỗi)
    // ============================================================
    function assignMailToDevice() {
        if (assigning) return; // tránh đệ quy khi set counter
        const key = "assigned_v3_" + currentRoom;
        let idx = localStorage.getItem(key);

        if (idx !== null) {
            idx = parseInt(idx);
            if (isNaN(idx) || !currentAccounts[idx]) {
                localStorage.removeItem(key);
                idx = null;
            }
        }

        if (idx === null) {
            if (currentAccounts.length === 0) { currentMail = ""; return; }
            if (currentCounter < currentAccounts.length) {
                idx = currentCounter;
                localStorage.setItem(key, idx);
                assigning = true;
                db.ref("rooms/" + currentRoom + "/counter").set(currentCounter + 1)
                    .finally(() => { assigning = false; });
            } else {
                currentMail = "";
                return;
            }
        }
        currentMail = currentAccounts[idx] || "";
    }

    // ============================================================
    // ADD MAIL
    // ============================================================
    function addMails() {
        const raw = document.getElementById("mailInput").value;
        const lines = raw.split("\n").map(s => s.trim()).filter(s => s.length > 0);

        if (lines.length === 0) { showToast("Vui lòng dán mail vào ô!"); return; }

        const existing = new Set(currentAccounts.map(m => m.toLowerCase()));
        const newList = currentAccounts.slice();
        let added = 0, dup = 0, other = 0;

        // Xác định domain chính (chỉ để đếm, không chặn)
        const domCount = {};
        currentAccounts.forEach(m => {
            const mm = m.match(/@([^\s|]+)/);
            if (mm) domCount[mm[1].toLowerCase()] = (domCount[mm[1].toLowerCase()] || 0) + 1;
        });
        let mainDomain = "";
        let maxC = 0;
        for (const d in domCount) if (domCount[d] > maxC) { maxC = domCount[d]; mainDomain = d; }

        lines.forEach(mail => {
            const lower = mail.toLowerCase();
            if (existing.has(lower)) { dup++; return; }
            const mm = mail.match(/@([^\s|]+)/);
            if (mainDomain && mm && mm[1].toLowerCase() !== mainDomain) other++;
            newList.push(mail);
            existing.add(lower);
            added++;
        });

        stats = { added, duplicate: dup, other };
        updateStats();

        if (added === 0) {
            showToast("Không có mail mới (trùng: " + dup + ")");
            return;
        }

        db.ref("rooms/" + currentRoom).set({
            accounts: newList,
            counter: currentCounter
        }).then(() => {
            document.getElementById("mailInput").value = "";
            showToast("Đã thêm " + added + " mail");
        }).catch(e => alert("Lỗi: " + e.message));
    }

    function updateStats() {
        document.getElementById("statAdd").innerText = stats.added || 0;
        document.getElementById("statDup").innerText = stats.duplicate || 0;
        document.getElementById("statOther").innerText = stats.other || 0;
    }

    // ============================================================
    // XÓA TẤT CẢ
    // ============================================================
    function clearAll() {
        if (currentAccounts.length === 0) { showToast("Danh sách đang trống"); return; }
        if (!confirm("Xóa tất cả " + currentAccounts.length + " mail trong phòng này?\nHành động không thể hoàn tác!")) return;
        db.ref("rooms/" + currentRoom).set({ accounts: [], counter: 0 }).then(() => {
            localStorage.removeItem("assigned_v3_" + currentRoom);
            stats = { added: 0, duplicate: 0, other: 0 };
            updateStats();
            showToast("Đã xóa tất cả mail");
        });
    }

    // ============================================================
    // TẢI FILE TXT
    // ============================================================
    function loadFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById("mailInput").value = ev.target.result;
            showToast("Đã tải file: " + file.name);
        };
        reader.readAsText(file);
        e.target.value = "";
    }

    // ============================================================
    // COPY MAIL
    // ============================================================
    function copyMail() {
        // Nếu chưa có mail, thử cấp lại
        if (!currentMail) assignMailToDevice();

        if (!currentMail) {
            if (currentAccounts.length === 0) {
                showToast("Phòng chưa có mail nào!");
            } else {
                showToast("Đã hết mail để cấp cho thiết bị này!");
            }
            return;
        }

        navigator.clipboard.writeText(currentMail).then(() => {
            showToast("Đã copy: " + currentMail);
        }).catch(() => {
            const ta = document.createElement("textarea");
            ta.value = currentMail;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showToast("Đã copy: " + currentMail);
        });
    }

    window.addEventListener("hashchange", init);
    init();
</script>

</body>
</html>
