<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Phối Mail Đám Mây</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
        h2 { color: #333; text-align: center; margin-top: 0; font-size: 20px; }
        .room-title { background: #e2f0cb; padding: 8px; border-radius: 5px; text-align: center; font-weight: bold; color: #2d6a4f; margin-bottom: 15px; font-size: 14px; }
        .box { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 5px; text-align: center; }
        .mail-display { font-family: monospace; font-size: 16px; color: #d63384; font-weight: bold; word-break: break-all; margin-bottom: 10px; }
        button { width: 100%; background: #0d6efd; color: white; border: none; padding: 12px; font-size: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:active { opacity: 0.8; }
        .admin-section { margin-top: 25px; border-top: 2px dashed #ddd; padding-top: 15px; }
        textarea { width: 100%; height: 130px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-warning { background: #ffc107; color: #000; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
        .loading { text-align: center; color: #666; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

<div class="card" id="app">
    <!-- MÀN HÌNH CHỌN PHÒNG -->
    <div id="homeView" style="display:none;">
        <h2>Quản Lý & Phân Phối Mail</h2>
        <p style="font-size: 13px; color: #666; text-align: center;">Nhập tên phòng của bạn (VD: Thoan2000, Nam123) để tạo hoặc truy cập:</p>
        <input type="text" id="roomInput" placeholder="Nhập tên phòng...">
        <button onclick="goToRoom()">Vào Phòng</button>
    </div>

    <!-- MÀN HÌNH TRONG PHÒNG -->
    <div id="roomView" style="display:none;">
        <div class="room-title" id="roomTitleDisplay">Phòng: ...</div>
        
        <div id="loadingBox" class="loading">Đang tải dữ liệu từ đám mây...</div>

        <!-- Phần cho thiết bị nhận mail -->
        <div id="userPart" style="display:none;">
            <h3 style="font-size: 16px; text-align: center; color: #333; margin-top:0;">Tài Khoản Của Thiết Bị Này</h3>
            <div class="box">
                <div class="mail-display" id="accountDisplay">Đang tải...</div>
            </div>
            <button onclick="copyAccount()">📋 SAO CHÉP TÀI KHOẢN</button>
        </div>

        <!-- Phần quản trị dán mail -->
        <div class="admin-section" id="adminPart" style="display:none;">
            <div style="font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #333;">Khu vực Chủ Phòng (Dán danh sách mail):</div>
            <textarea id="adminInput" placeholder="email1@domain.com|pass1&#10;email2@domain.com|pass2"></textarea>
            <div class="btn-group">
                <button onclick="saveRoomList()" style="flex: 2;">💾 Lưu Lên Đám Mây</button>
                <button class="btn-warning" onclick="resetCounter()" style="flex: 1;">🔄 Reset Lượt</button>
            </div>
            <button onclick="goHome()" style="background: #6c757d; margin-top: 10px;">🏠 Đổi Phòng</button>
        </div>
    </div>
</div>

<script>
    function getRoomName() {
        return window.location.hash.replace("#", "").trim().toUpperCase();
    }

    function initApp() {
        let room = getRoomName();
        if (!room) {
            document.getElementById("homeView").style.display = "block";
            document.getElementById("roomView").style.display = "none";
        } else {
            document.getElementById("homeView").style.display = "none";
            document.getElementById("roomView").style.display = "block";
            document.getElementById("roomTitleDisplay").innerText = "Phòng: " + room;
            fetchCloudData(room);
        }
    }

    function goToRoom() {
        let room = document.getElementById("roomInput"].value.trim();
        if(room) {
            window.location.hash = room;
            initApp();
        } else {
            alert("Vui lòng nhập tên phòng!");
        }
    }

    function goHome() {
        window.location.hash = "";
        initApp();
    }

    // Sử dụng dịch vụ JSONBin công khai miễn phí để đồng bộ thật giữa các thiết bị
    async function fetchCloudData(room) {
        document.getElementById("loadingBox").style.display = "block";
        document.getElementById("userPart").style.display = "none";
        document.getElementById("adminPart").style.display = "none";

        try {
            let res = await fetch("https://api.jsonbin.io/v3/b/661d9a2de41b4d34e44a45a6/latest", {
                headers: { "X-Master-Key": "$2a$10$7v5Q... (public)" } // Dùng public bin cơ bản
            });
            // Tạm dùng giải pháp lưu trữ nhanh qua JSONbin public bin chung phân loại theo key phòng
            let response = await fetch("https://api.npoint.io/" + getBinId(room));
            let data = response.ok ? await response.json() : { accounts: [], assigned: {} };
            
            renderData(room, data);
        } catch (e) {
            // Fallback nếu lỗi kết nối
            renderData(room, { accounts: [], assigned: {} });
        }
    }

    // Giải pháp tối ưu: Dùng npoint.io với id động theo tên phòng chuẩn
    async function fetchCloudData(room) {
        document.getElementById("loadingBox").style.display = "block";
        document.getElementById("userPart").style.display = "none";
        document.getElementById("adminPart").style.display = "none";

        try {
            let res = await fetch("https://api.npoint.io/mailroom_" + room);
            let data = res.ok ? await res.json() : { accounts: [] };
            
            document.getElementById("loadingBox").style.display = "none";
            document.getElementById("userPart").style.display = "block";
            document.getElementById("adminPart").style.display = "block";

            processCloudData(room, data);
        } catch(err) {
            document.getElementById("loadingBox").style.display = "none";
            document.getElementById("userPart").style.display = "block";
            document.getElementById("adminPart").style.display = "block";
            processCloudData(room, { accounts: [] });
        }
    }

    function getDeviceID() {
        let id = localStorage.getItem("my_device_id");
        if (!id) {
            id = "dev_" + Math.random().toString(36.substring(2, 9));
            localStorage.setItem("my_device_id", id);
        }
        return id;
    }

    function processCloudData(room, data) {
        let accounts = data.accounts || [];
        document.getElementById("adminInput").value = accounts.join("\n");

        let devId = getDeviceID();
        let assignments = data.assignments || {};

        // Nếu thiết bị này đã được cấp 1 mail trước đó trong cloud, lấy lại đúng mail đó
        let assignedMail = assignments[devId];

        if (!assignedMail) {
            // Tìm xem mail nào chưa ai nhận thì cấp cho máy này
            let usedMails = Object.values(assignments);
            let availableMail = accounts.find(m => !usedMails.includes(m));

            if (availableMail) {
                assignedMail = availableMail;
                assignments[devId] = assignedMail;
                // Lưu ngược lên mây
                saveToCloud(room, { accounts: accounts, assignments: assignments }, false);
            } else {
                document.getElementById("accountDisplay").innerText = "Phòng này đã hết tài khoản hoặc tất cả máy đã nhận hết!";
                return;
            }
        }

        if (assignedMail) {
            document.getElementById("accountDisplay").innerText = assignedMail;
        } else {
            document.getElementById("accountDisplay").innerText = "Chưa có tài khoản trong phòng này!";
        }
    }

    async function saveRoomList() {
        let room = getRoomName();
        let rawText = document.getElementById("adminInput").value;
        let lines = rawText.split("\n").map(item => item.trim()).filter(item => item.length > 0);
        
        let newData = {
            accounts: lines,
            assignments: {} // Reset phân phối khi chủ phòng đổi danh sách mới
        };

        await saveToCloud(room, newData, true);
    }

    async function resetCounter() {
        let room = getRoomName();
        if(confirm("Bạn có muốn reset lại toàn bộ lượt cấp phát cho các thiết bị không?")) {
            let rawText = document.getElementById("adminInput").value;
            let lines = rawText.split("\n").map(item => item.trim()).filter(item => item.length > 0);
            
            let newData = {
                accounts: lines,
                assignments: {}
            };
            await saveToCloud(room, newData, true);
        }
    }

    async function saveToCloud(room, data, showAlert) {
        try {
            await fetch("https://api.npoint.io/mailroom_" + room, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            if(showAlert) {
                alert("Đã lưu và đồng bộ lên đám mây thành công!");
                location.reload();
            }
        } catch(e) {
            alert("Lỗi kết nối đám mây!");
        }
    }

    function copyAccount() {
        let text = document.getElementById("accountDisplay").innerText;
        if(text.includes("@")) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Đã sao chép: " + text);
            });
        } else {
            alert("Không có tài khoản hợp lệ!");
        }
    }

    window.addEventListener("hashchange", initApp);
    initApp();
</script>

</body>
</html>
