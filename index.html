<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mail Manager Pro</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-0: #08090d; --bg-1: #0d0f14; --bg-2: #131620;
        --border-1: rgba(255,255,255,0.06); --border-2: rgba(255,255,255,0.1); --border-3: rgba(255,255,255,0.14);
        --text-1: #fff; --text-2: #a8b0c2; --text-3: #6b7280;
        --accent-1: #7c5cff; --accent-2: #5b8def;
        --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior-y: none; }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-0); color: var(--text-1);
        min-height: 100vh; min-height: 100dvh;
        padding: calc(12px + var(--safe-top)) 12px calc(16px + var(--safe-bottom));
        display: flex; justify-content: center; align-items: flex-start;
        -webkit-font-smoothing: antialiased; letter-spacing: -0.011em;
        font-size: 15px; line-height: 1.4;
    }
    /* 1 lớp gradient tĩnh thay cho animation mesh */
    body::before {
        content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
            radial-gradient(ellipse 600px 400px at 50% -10%, rgba(124,92,255,0.14), transparent 65%),
            radial-gradient(ellipse 500px 350px at 50% 110%, rgba(91,141,239,0.09), transparent 65%);
    }
    .container { width: 100%; max-width: 480px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; }

    .card {
        background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
        border: 1px solid var(--border-2); border-radius: 18px; padding: 16px;
        box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px -12px rgba(0,0,0,0.55);
    }

    /* HEADER */
    .app-header { display: flex; align-items: center; gap: 12px; padding: 2px 2px 0; }
    .logo-mark {
        width: 44px; height: 44px; border-radius: 13px;
        background: linear-gradient(135deg, #7c5cff 0%, #5b8def 50%, #06b6d4 100%);
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        box-shadow: 0 6px 18px -6px rgba(124,92,255,0.6);
    }
    .logo-mark svg { width: 22px; height: 22px; stroke: white; stroke-width: 2; fill: none; }
    .header-info { flex: 1; min-width: 0; }
    .header-label {
        font-size: 10px; font-weight: 700; color: var(--text-3); letter-spacing: 0.12em;
        text-transform: uppercase; display: flex; align-items: center; gap: 6px;
    }
    .header-label .live-dot {
        width: 6px; height: 6px; border-radius: 50%; background: var(--success);
        box-shadow: 0 0 8px var(--success);
    }
    .header-room {
        font-size: 20px; font-weight: 800; color: var(--text-1); margin-top: 2px;
        letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* MAIL DISPLAY */
    .mail-display {
        position: relative;
        background: linear-gradient(180deg, rgba(124,92,255,0.09) 0%, rgba(124,92,255,0.02) 100%);
        border: 1px solid rgba(124,92,255,0.22); border-radius: 14px;
        padding: 20px 14px; text-align: center; min-height: 88px;
        display: flex; align-items: center; justify-content: center;
        margin-top: 14px;
    }
    .mail-display .mail-value {
        font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700;
        color: #cbb9ff; word-break: break-all; line-height: 1.55;
        text-shadow: 0 0 16px rgba(124,92,255,0.35);
    }
    .mail-display.empty .mail-value {
        color: var(--text-3); font-family: 'Inter', sans-serif; font-weight: 500;
        font-size: 13.5px; text-shadow: none;
    }
    .mail-display.loading .mail-value {
        color: var(--accent-1); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    }
    .status-row {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        font-size: 11.5px; color: var(--text-3); margin-top: 11px; font-weight: 500;
    }
    .status-row svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* BUTTONS */
    .btn {
        position: relative; display: flex; align-items: center; justify-content: center;
        gap: 9px; padding: 14px 16px; min-height: 50px;
        border: none; border-radius: 13px;
        font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: -0.005em;
        cursor: pointer; width: 100%; color: white;
        transition: transform 0.1s ease, opacity 0.15s ease;
        overflow: hidden;
    }
    .btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2.2; fill: none; flex-shrink: 0; }
    .btn:active:not(:disabled) { transform: scale(0.97); opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
        background: linear-gradient(135deg, #7c5cff 0%, #5b8def 100%);
        box-shadow: 0 6px 18px -6px rgba(124,92,255,0.65);
    }
    .btn-success {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 6px 18px -6px rgba(16,185,129,0.55);
    }
    .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text-2); border: 1px solid var(--border-2); }
    .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 6px 18px -6px rgba(239,68,68,0.5); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .action-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .action-grid.two { grid-template-columns: 1fr 1fr; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat {
        background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
        border: 1px solid var(--border-1); border-radius: 12px;
        padding: 12px 6px; text-align: center; position: relative; overflow: hidden;
    }
    .stat::before {
        content: ''; position: absolute; top: 0; left: 20%; right: 20%;
        height: 1px; background: currentColor; opacity: 0.55;
    }
    .stat-value { font-size: 21px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 9px; font-weight: 700; color: var(--text-3); margin-top: 5px; letter-spacing: 0.08em; text-transform: uppercase; }
    .stat.total { color: #8b7fff; } .stat.total .stat-value { color: #a899ff; }
    .stat.added { color: var(--success); } .stat.added .stat-value { color: #34d399; }
    .stat.dup { color: var(--danger); } .stat.dup .stat-value { color: #f87171; }
    .stat.other { color: var(--warning); } .stat.other .stat-value { color: #fbbf24; }

    /* ADMIN */
    .admin-toggle {
        display: flex; align-items: center; justify-content: center; gap: 7px;
        padding: 12px; min-height: 46px;
        background: rgba(255,255,255,0.03); border: 1px dashed var(--border-2);
        border-radius: 13px; color: var(--text-3); font-size: 12px; font-weight: 600;
        font-family: inherit; cursor: pointer; width: 100%;
        transition: background 0.15s, color 0.15s;
    }
    .admin-toggle:active { background: rgba(255,255,255,0.08); color: var(--text-2); }
    .admin-toggle svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
    .admin-panel {
        display: flex; flex-direction: column; gap: 12px;
        background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
        border: 1px solid var(--border-2); border-radius: 18px; padding: 14px;
        box-shadow: 0 8px 24px -12px rgba(0,0,0,0.55);
    }
    .tabs {
        display: flex; gap: 4px; padding: 4px;
        background: rgba(0,0,0,0.32); border-radius: 12px;
        border: 1px solid var(--border-1); margin-bottom: 2px;
    }
    .tab {
        flex: 1; padding: 9px 6px; min-height: 38px; border: none; background: transparent;
        color: var(--text-3); font-family: inherit; font-size: 12px; font-weight: 700;
        cursor: pointer; border-radius: 9px;
        display: flex; align-items: center; justify-content: center; gap: 5px;
        transition: background 0.15s, color 0.15s;
    }
    .tab.active {
        background: linear-gradient(135deg, rgba(124,92,255,0.25), rgba(91,141,239,0.18));
        color: #c4b5fd;
    }
    .tab svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.2; fill: none; }

    /* INPUTS — font ≥16px để iOS không zoom */
    .admin-panel textarea {
        width: 100%; min-height: 130px; padding: 13px;
        background: rgba(0,0,0,0.42); border: 1px solid var(--border-2); border-radius: 12px;
        font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 1.55;
        color: var(--text-1); resize: vertical; outline: none;
        -webkit-appearance: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .admin-panel textarea:focus {
        border-color: rgba(124,92,255,0.55);
        box-shadow: 0 0 0 3px rgba(124,92,255,0.12);
    }
    .admin-panel textarea::placeholder { color: var(--text-3); font-size: 14px; }

    .admin-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .admin-actions .btn { padding: 10px 8px; min-height: 44px; font-size: 11.5px; border-radius: 10px; gap: 5px; }
    .admin-actions .btn svg { width: 14px; height: 14px; }

    .search-input {
        width: 100%; padding: 11px 14px; min-height: 46px;
        background: rgba(0,0,0,0.42); border: 1px solid var(--border-2); border-radius: 12px;
        font-family: inherit; font-size: 16px; color: var(--text-1); outline: none;
        -webkit-appearance: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
        border-color: rgba(124,92,255,0.55);
        box-shadow: 0 0 0 3px rgba(124,92,255,0.12);
    }

    .mail-list {
        max-height: 55vh; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: rgba(0,0,0,0.3); border: 1px solid var(--border-1); border-radius: 12px;
        padding: 5px;
    }
    .mail-item {
        display: flex; align-items: center; gap: 8px; padding: 9px 10px;
        border-radius: 8px; font-size: 11.5px; font-family: 'JetBrains Mono', monospace;
        color: var(--text-2); border-bottom: 1px solid var(--border-1);
    }
    .mail-item:last-child { border-bottom: none; }
    .mail-item.used { color: rgba(168,176,194,0.4); text-decoration: line-through; }
    .mail-item .mail-idx { color: var(--text-3); font-size: 10px; min-width: 24px; font-weight: 600; }
    .mail-item .mail-txt { flex: 1; word-break: break-all; }
    .mail-item .mail-badge {
        font-size: 9px; padding: 3px 6px; border-radius: 5px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.05em;
    }
    .mail-item.available .mail-badge { background: rgba(16,185,129,0.14); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
    .mail-item.used .mail-badge { background: rgba(239,68,68,0.14); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }

    .log-list {
        max-height: 55vh; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: rgba(0,0,0,0.3); border: 1px solid var(--border-1); border-radius: 12px;
        padding: 6px;
    }
    .log-item {
        display: flex; align-items: flex-start; gap: 8px; padding: 9px 10px;
        border-bottom: 1px solid var(--border-1); font-size: 11px; color: var(--text-2);
    }
    .log-item:last-child { border-bottom: none; }
    .log-item .log-time { color: var(--text-3); font-size: 10px; font-family: 'JetBrains Mono', monospace; min-width: 68px; font-weight: 600; }
    .log-item .log-mail { font-family: 'JetBrains Mono', monospace; color: #c4b5fd; flex: 1; word-break: break-all; }
    .log-item .log-device { color: var(--text-3); font-size: 9px; font-family: 'JetBrains Mono', monospace; }

    .empty-state { text-align: center; padding: 22px 14px; color: var(--text-3); font-size: 12px; font-weight: 500; }

    /* HOME */
    .home-card { text-align: center; padding: 34px 22px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .home-logo {
        width: 76px; height: 76px; border-radius: 22px;
        background: linear-gradient(135deg, #7c5cff 0%, #5b8def 50%, #06b6d4 100%);
        display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
        box-shadow: 0 12px 32px -10px rgba(124,92,255,0.7);
    }
    .home-logo svg { width: 38px; height: 38px; stroke: white; stroke-width: 1.8; fill: none; }
    .home-title {
        font-size: 24px; font-weight: 800; letter-spacing: -0.035em;
        background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .home-sub { font-size: 13px; color: var(--text-3); font-weight: 500; margin-bottom: 20px; }
    .home-input-wrap { width: 100%; position: relative; margin-bottom: 12px; }
    .home-input-wrap svg {
        position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
        width: 18px; height: 18px; stroke: var(--text-3); stroke-width: 2; fill: none; pointer-events: none;
    }
    .home-input {
        width: 100%; padding: 15px 16px 15px 44px; min-height: 52px;
        background: rgba(0,0,0,0.42); border: 1px solid var(--border-2); border-radius: 13px;
        font-size: 16px; font-weight: 600; font-family: inherit; color: var(--text-1);
        outline: none; -webkit-appearance: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .home-input:focus {
        border-color: rgba(124,92,255,0.55);
        box-shadow: 0 0 0 3px rgba(124,92,255,0.12);
    }
    .home-input::placeholder { color: var(--text-3); }

    /* FOOTER */
    .footer {
        text-align: center; padding: 8px 0 0;
        display: flex; align-items: center; justify-content: center; gap: 5px;
        font-size: 11px; color: var(--text-3); font-weight: 500;
    }
    .footer b {
        background: linear-gradient(135deg, #c4b5fd 0%, #7c5cff 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; font-weight: 800;
    }

    /* TOAST */
    .toast {
        position: fixed; top: calc(16px + var(--safe-top)); left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: rgba(20,22,30,0.98); border: 1px solid var(--border-3);
        color: white; padding: 13px 20px; border-radius: 13px;
        font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0;
        transition: opacity 0.25s ease, transform 0.25s ease;
        pointer-events: none; max-width: calc(100% - 32px); text-align: center;
        box-shadow: 0 16px 40px -10px rgba(0,0,0,0.75);
        display: flex; align-items: center; gap: 9px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2.5; fill: none; flex-shrink: 0; }
    .toast.success { border-color: rgba(16,185,129,0.4); color: #6ee7b7; }
    .toast.error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    .toast.info { border-color: rgba(124,92,255,0.4); color: #c4b5fd; }

    /* MODAL */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(8,9,13,0.88);
        display: flex; align-items: center; justify-content: center;
        z-index: 10000; padding: 18px;
    }
    .modal {
        background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
        border: 1px solid var(--border-3); border-radius: 20px;
        padding: 22px; max-width: 400px; width: 100%; text-align: center;
        box-shadow: 0 30px 60px -20px rgba(0,0,0,0.85);
    }
    .modal-icon {
        width: 54px; height: 54px; border-radius: 16px;
        background: linear-gradient(135deg, rgba(124,92,255,0.2), rgba(91,141,239,0.2));
        border: 1px solid rgba(124,92,255,0.3);
        display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
    }
    .modal-icon svg { width: 26px; height: 26px; stroke: #a899ff; stroke-width: 2; fill: none; }
    .modal h3 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    .modal p { font-size: 12.5px; color: var(--text-2); line-height: 1.55; margin-bottom: 14px; }
    .modal input {
        width: 100%; padding: 14px;
        background: rgba(0,0,0,0.5); border: 1px solid rgba(124,92,255,0.4); border-radius: 12px;
        font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700;
        color: #c4b5fd; text-align: center; margin-bottom: 14px; outline: none;
        -webkit-appearance: none;
    }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }

    /* SPINNER */
    .spinner {
        width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.25);
        border-top-color: white; border-radius: 50%;
        animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    .spinner-purple { border-color: rgba(124,92,255,0.3); border-top-color: var(--accent-1); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    @media (max-width: 380px) {
        body { padding-left: 10px; padding-right: 10px; }
        .stats-grid { gap: 5px; }
        .stat { padding: 11px 4px; }
        .stat-value { font-size: 18px; }
        .stat-label { font-size: 8.5px; }
        .action-grid.two { grid-template-columns: 1fr; }
        .header-room { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
</style>
</head>
<body>

<div class="container">

    <div id="homeView" class="card home-card hidden">
        <div class="home-logo">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3"/>
                <path d="M2 7l10 6 10-6"/>
            </svg>
        </div>
        <h1 class="home-title">Mail Manager</h1>
        <p class="home-sub">Nhập tên phòng để bắt đầu</p>
        <div class="home-input-wrap">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0z"/>
                <path d="M12 8v4l3 3"/>
            </svg>
            <input type="text" class="home-input" id="roomInput" placeholder="..." autocomplete="off">
        </div>
        <button class="btn btn-primary" onclick="goToRoom()">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
            </svg>
            VÀO PHÒNG
        </button>
        <div class="footer" style="margin-top: 20px;">
            <span>Made with</span>
            <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:#ef4444;">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span>by</span><b>TRAN VAN THOAN</b>
        </div>
    </div>

    <div id="mainView" class="hidden">

        <div class="card">
            <div class="app-header">
                <div class="logo-mark">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="3"/>
                        <path d="M2 7l10 6 10-6"/>
                    </svg>
                </div>
                <div class="header-info">
                    <div class="header-label">
                        <span class="live-dot"></span>
                        PHÒNG ĐANG HOẠT ĐỘNG
                    </div>
                    <div class="header-room" id="roomName">—</div>
                </div>
            </div>

            <div class="mail-display loading" id="mailDisplay">
                <div class="mail-value">
                    <span style="display:inline-flex;align-items:center;gap:8px;">
                        <span class="spinner spinner-purple"></span>
                        Đang tải...
                    </span>
                </div>
            </div>

            <div class="status-row" id="statusRow">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                </svg>
                <span id="mailHint">Bấm COPY để nhận mail</span>
            </div>
        </div>

        <div class="action-grid" id="actionGrid">
            <button class="btn btn-primary" id="btnCopyMain" onclick="copyMail(false)" disabled>
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                    <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
                </svg>
                COPY MAIL
            </button>
            <button class="btn btn-primary hidden" id="btnCopyAgain" onclick="copyCurrentAgain()">

        <div class="card admin-panel hidden" id="adminPanel">
            <div class="tabs">

                <button class="tab" id="tabList" onclick="switchTab('list')">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/>

                <button class="tab" id="tabLog" onclick="switchTab('log')">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">

            <div id="panelAdd">

                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>

                    <button class="btn btn-ghost" onclick="document.getElementById('fileInput').click()">
                        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <path d="M14 2v6h6"/>

                    </button>

                <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="loadFile(event)">

                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm mail..." oninput="renderMailList()">

                    <button class="btn btn-ghost" onclick="exportMails()" style="font-size:12px; padding:10px; min-height:44px;">

                    <button class="btn btn-warning" onclick="resetCounter()" style="font-size:12px; padding:10px; min-height:44px;">
                        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>

            <div id="panelLog" class="hidden">
                <div class="log-list" id="logList">
                    <div class="empty-state">Chưa có lịch sử</div>
                </div>
                <button class="btn btn-ghost" onclick="exportLog()" style="font-size:12px; padding:10px; margin-top:10px; min-height:44px;">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>

                    EXPORT LOG

        <div class="footer">

            <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:#ef4444;">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span>by</span><b>TRAN VAN THOAN</b>
        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAFTBub56US4pY2NhZIB9s3XGPktd4VKko",
        authDomain: "mail-manager-620f4.firebaseapp.com",
        databaseURL: "https://mail-manager-620f4-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "mail-manager-620f4",
        storageBucket: "mail-manager-620f4.firebasestorage.app",
        messagingSenderId: "1093473633575",
        appId: "1:1093473633575:web:556ed50c43e5fda06ad502"
    };
    const COPY_COOLDOWN = 5;
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = "";
    let currentAccounts = [];
    let currentBatch = 0;
    let currentHistory = [];
    let stats = { added: 0, duplicate: 0, other: 0 };
    let copying = false;
    let activeTab = 'add';

    function getDeviceId() {
        let id = localStorage.getItem("device_id");
        if (!id) {
            id = 'DEV-' + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10)).toUpperCase();
            localStorage.setItem("device_id", id);
        }
        return id;
    }

    function showToast(msg, type) {
        const t = document.getElementById("toast");
        const icons = {
            success: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
            error: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>',
            info: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>'
        };
        t.className = "toast show" + (type ? " " + type : "");
        t.innerHTML = (icons[type] || '') + '<span>' + msg + '</span>';
        clearTimeout(t._tm);
        t._tm = setTimeout(() => t.className = "toast", 2500);
    }

    function getRoom() { return window.location.hash.replace("#", "").trim(); }

    function init() {
        const room = getRoom();
        if (!room) {
            document.getElementById("homeView").classList.remove("hidden");
            document.getElementById("mainView").classList.add("hidden");
        } else {
            document.getElementById("homeView").classList.add("hidden");
            document.getElementById("mainView").classList.remove("hidden");
            document.getElementById("roomName").innerText = room.toUpperCase();
            if (currentRoom !== room) {
                currentRoom = room;
                loadRoom(room);
            }
        }
    }

    function goToRoom() {
        const r = document.getElementById("roomInput").value.trim();
        if (!r) { showToast("Vui lòng nhập tên phòng!", "error"); return; }
        window.location.hash = r;
        init();
    }

    function loadRoom(room) {
        db.ref("rooms/" + room).on("value", (snap) => {
            const data = snap.val() || {};
            currentAccounts = data.accounts || [];
            const newBatch = data.batch || 0;
            const savedBatchRaw = localStorage.getItem("my_mail_batch_" + room);
            const savedBatch = savedBatchRaw === null ? null : Number(savedBatchRaw);

            if (savedBatch !== null && savedBatch !== newBatch) {
                const hadOldMail = !!localStorage.getItem("my_mail_" + room);
                localStorage.removeItem("my_mail_" + room);
                localStorage.setItem("my_mail_batch_" + room, newBatch);
                if (hadOldMail) showToast("Có mail mới! Bấm COPY để nhận.", "success");
            } else {
                localStorage.setItem("my_mail_batch_" + room, newBatch);
            }
            currentBatch = newBatch;
            document.getElementById("statTotal").innerText = currentAccounts.length;
            renderCurrentMail();
            if (!document.getElementById("adminPanel").classList.contains("hidden")) renderMailList();
        });

        db.ref("rooms/" + room + "/history").limitToLast(50).on("value", (snap) => {
            const data = snap.val() || {};
            currentHistory = Object.keys(data).map(k => ({ id: k, ...data[k] }))
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            if (activeTab === 'log') renderLogList();
        });
    }

    function renderCurrentMail() {
        const el = document.getElementById("mailDisplay");
        const hint = document.getElementById("mailHint");
        const btnCopyMain = document.getElementById("btnCopyMain");
        const btnCopyAgain = document.getElementById("btnCopyAgain");
        const btnGetNew = document.getElementById("btnGetNew");
        const actionGrid = document.getElementById("actionGrid");

        const myMail = localStorage.getItem("my_mail_" + currentRoom);

        if (myMail) {
            const emailOnly = myMail.split("|")[0].trim();
            el.className = "mail-display";
            el.querySelector(".mail-value").innerText = emailOnly;
            hint.innerText = "Mail đã lưu • Nhấn Ctrl+Enter để copy lại";
            actionGrid.classList.add("two");
            btnCopyMain.classList.add("hidden");
            btnCopyAgain.classList.remove("hidden");
            btnGetNew.classList.remove("hidden");
            btnCopyAgain.disabled = false;
            btnGetNew.disabled = currentAccounts.length === 0;
        } else {
            el.className = "mail-display empty";
            el.querySelector(".mail-value").innerText = "Chưa có mail nào";
            hint.innerText = "Bấm COPY để nhận mail";
            actionGrid.classList.remove("two");
            btnCopyMain.classList.remove("hidden");
            btnCopyAgain.classList.add("hidden");
            btnGetNew.classList.add("hidden");
            btnCopyMain.disabled = currentAccounts.length === 0;
        }
    }

    function copyCurrentAgain() {
        const myMail = localStorage.getItem("my_mail_" + currentRoom);
        if (!myMail) { showToast("Chưa có mail để copy!", "error"); return; }
        const mailToCopy = myMail.split("|")[0].trim();
        const btn = document.getElementById("btnCopyAgain");
        btn.disabled = true;
        tryCopy(mailToCopy).then(() => {
            showToast("Đã copy: " + mailToCopy, "success");
            btn.disabled = false;
        }).catch(() => {
            showManualCopyModal(mailToCopy);
            btn.disabled = false;
        });
    }

    function copyMail(forceNew) {
        if (copying) return;

        const lastCopy = Number(localStorage.getItem("last_copy_" + currentRoom) || 0);
        const now = Date.now();
        const wait = COPY_COOLDOWN * 1000;
        if (now - lastCopy < wait) {
            const remain = Math.ceil((wait - (now - lastCopy)) / 1000);
            showToast("Chờ " + remain + "s rồi thử lại", "error");
            return;
        }

        const hadMail = !!localStorage.getItem("my_mail_" + currentRoom);
        if (hadMail && !forceNew) return;
        if (hadMail && forceNew) {
            if (!confirm("Đổi sang mail khác?")) return;
        }

        copying = true;
        const btnMain = document.getElementById("btnCopyMain");
        const btnNew = document.getElementById("btnGetNew");
        const origMain = btnMain.innerHTML;
        const origNew = btnNew.innerHTML;

        if (forceNew || hadMail) {
            btnNew.disabled = true;
            btnNew.innerHTML = '<span class="spinner"></span> ĐANG LẤY...';
        } else {
            btnMain.disabled = true;
            btnMain.innerHTML = '<span class="spinner"></span> ĐANG LẤY MAIL...';
        }

        let claimedMail = null;
        db.ref("rooms/" + currentRoom + "/accounts").transaction(
            (list) => {
                if (!list || list.length === 0) return;
                claimedMail = list[0];
                return list.slice(1);
            },
            (error, committed, snapshot) => {
                copying = false;
                btnMain.innerHTML = origMain;
                btnNew.innerHTML = origNew;

                if (error || !committed || !claimedMail) {
                    showToast(error ? "Lỗi: " + error.message : "Hết mail rồi!", "error");
                    renderCurrentMail();
                    return;
                }

                localStorage.setItem("my_mail_" + currentRoom, claimedMail);
                localStorage.setItem("my_mail_batch_" + currentRoom, currentBatch);
                localStorage.setItem("last_copy_" + currentRoom, Date.now());

                const mailToCopy = claimedMail.split("|")[0].trim();
                db.ref("rooms/" + currentRoom + "/history").push({
                    mail: mailToCopy,
                    deviceId: getDeviceId(),
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    userAgent: navigator.userAgent.slice(0, 80)
                });

                tryCopy(mailToCopy).then(() => {
                    showToast("Đã copy: " + mailToCopy, "success");
                }).catch(() => {
                    showManualCopyModal(mailToCopy);
                }).finally(() => renderCurrentMail());
            }
        );
    }

    function tryCopy(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise((resolve, reject) => {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.top = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, 99999);
            try { document.execCommand("copy"); resolve(); }
            catch (e) { reject(e); }
            document.body.removeChild(ta);
        });
    }

    function showManualCopyModal(mail) {
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
            <div class="modal">
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
                    </svg>
                </div>
                <h3>Mail của bạn</h3>
                <p>Bấm <b>COPY</b> hoặc bấm giữ vào ô để sao chép</p>
                <input type="text" id="modalMailInput" value="${mail.replace(/"/g, '&quot;')}" readonly>
                <div class="modal-actions">
                    <button class="btn btn-primary" id="modalCopyBtn">COPY</button>
                    <button class="btn btn-ghost" id="modalCloseBtn">ĐÓNG</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        const input = overlay.querySelector("#modalMailInput");
        const copyBtn = overlay.querySelector("#modalCopyBtn");
        const closeBtn = overlay.querySelector("#modalCloseBtn");
        setTimeout(() => { input.focus(); input.select(); }, 100);
        copyBtn.onclick = () => {
            input.focus(); input.select(); input.setSelectionRange(0, 99999);
            try {
                if (document.execCommand("copy")) {
                    copyBtn.innerHTML = '✓ ĐÃ COPY!';
                    copyBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    setTimeout(() => {
                        copyBtn.innerHTML = 'COPY';
                        copyBtn.style.background = '';
                    }, 1500);
                }
            } catch (e) {}
        };
        closeBtn.onclick = () => overlay.remove();
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    }

    function toggleAdmin() {
        const panel = document.getElementById("adminPanel");
        const txt = document.getElementById("toggleAdminText");
        if (!panel.classList.contains("hidden")) {
            panel.classList.add("hidden");
            txt.innerText = "MỞ KHU VỰC QUẢN TRỊ";
        } else {
            panel.classList.remove("hidden");
            txt.innerText = "ĐÓNG KHU VỰC QUẢN TRỊ";
            renderMailList();
        }
    }

    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.getElementById("tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add("active");
        document.getElementById("panelAdd").classList.toggle("hidden", tab !== 'add');
        document.getElementById("panelList").classList.toggle("hidden", tab !== 'list');
        document.getElementById("panelLog").classList.toggle("hidden", tab !== 'log');
        if (tab === 'list') renderMailList();
        if (tab === 'log') renderLogList();
    }

    function addMails() {
        const raw = document.getElementById("mailInput").value;
        const lines = raw.split("\n").map(s => s.trim()).filter(s => s.length > 0);
        if (lines.length === 0) { showToast("Vui lòng dán mail vào ô!", "error"); return; }

        const existing = new Set(currentAccounts.map(m => m.toLowerCase()));
        const newList = currentAccounts.slice();
        let added = 0, dup = 0, other = 0;

        const domCount = {};
        currentAccounts.forEach(m => {
            const mm = m.match(/@([^\s|]+)/);
            if (mm) domCount[mm[1].toLowerCase()] = (domCount[mm[1].toLowerCase()] || 0) + 1;
        });
        let mainDomain = "", maxC = 0;
        for (const d in domCount) if (domCount[d] > maxC) { maxC = domCount[d]; mainDomain = d; }

        lines.forEach(mail => {
            const lower = mail.toLowerCase();
            if (existing.has(lower)) { dup++; return; }
            const mm = mail.match(/@([^\s|]+)/);
            if (mainDomain && mm && mm[1].toLowerCase() !== mainDomain) other++;
            newList.push(mail);
            existing.add(lower);
            added++;
        });

        stats = { added, duplicate: dup, other };
        updateStats();

        if (added === 0) { showToast("Không có mail mới (trùng: " + dup + ")", "error"); return; }

        db.ref("rooms/" + currentRoom).set({
            accounts: newList,
            batch: Date.now()
        }).then(() => {
            document.getElementById("mailInput").value = "";
            showToast("Đã thêm " + added + " mail", "success");
        }).catch(e => showToast("Lỗi: " + e.message, "error"));
    }

    function updateStats() {
        document.getElementById("statAdd").innerText = stats.added || 0;
        document.getElementById("statDup").innerText = stats.duplicate || 0;
        document.getElementById("statOther").innerText = stats.other || 0;
    }

    function clearAll() {
        if (currentAccounts.length === 0) { showToast("Danh sách đang trống"); return; }
        if (!confirm("Xóa TẤT CẢ " + currentAccounts.length + " mail?")) return;
        localStorage.removeItem("my_mail_" + currentRoom);
        db.ref("rooms/" + currentRoom).set({
            accounts: [],
            batch: Date.now()
        }).then(() => {
            stats = { added: 0, duplicate: 0, other: 0 };
            updateStats();
            renderCurrentMail();
            showToast("Đã xóa tất cả", "success");
        });
    }

    function resetCounter() {
        if (!confirm("Reset lượt trên máy này?")) return;
        localStorage.removeItem("my_mail_" + currentRoom);
        localStorage.removeItem("last_copy_" + currentRoom);
        renderCurrentMail();
        showToast("Đã reset lượt trên máy này", "success");
    }

    function loadFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById("mailInput").value = ev.target.result;
            showToast("Đã tải file: " + file.name, "success");
        };
        reader.readAsText(file);
        e.target.value = "";
    }

    function renderMailList() {
        const list = document.getElementById("mailList");
        const query = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
        const usedSet = new Set(currentHistory.filter(h => h.mail).map(h => h.mail.toLowerCase()));

        let filtered = currentAccounts;
        if (query) filtered = currentAccounts.filter(m => m.toLowerCase().includes(query));

        if (filtered.length === 0) {
            list.innerHTML = '<div class="empty-state">' + (query ? 'Không tìm thấy' : 'Chưa có mail nào') + '</div>';
            return;
        }

        let html = "";
        filtered.forEach((mail) => {
            const realIdx = currentAccounts.indexOf(mail);
            const isUsed = usedSet.has(mail.split("|")[0].trim().toLowerCase());
            const cls = isUsed ? 'used' : 'available';
            const badge = isUsed ? 'ĐÃ CẤP' : 'CÒN';
            html += `<div class="mail-item ${cls}">
                <span class="mail-idx">#${realIdx + 1}</span>
                <span class="mail-txt">${escapeHtml(mail)}</span>
                <span class="mail-badge">${badge}</span>
            </div>`;
        });
        list.innerHTML = html;
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    function renderLogList() {
        const list = document.getElementById("logList");
        if (currentHistory.length === 0) {
            list.innerHTML = '<div class="empty-state">Chưa có lịch sử</div>';
            return;
        }
        let html = "";
        currentHistory.forEach(log => {
            const time = log.timestamp ? formatTime(log.timestamp) : '—';
            html += `<div class="log-item">
                <span class="log-time">${time}</span>
                <span class="log-mail">${escapeHtml(log.mail || '—')}</span>
                <span class="log-device">${escapeHtml(log.deviceId || '—')}</span>
            </div>`;
        });
        list.innerHTML = html;
    }

    function formatTime(ts) {
        const d = new Date(ts);
        const pad = n => String(n).padStart(2, '0');
        return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function exportLog() {
        if (currentHistory.length === 0) { showToast("Chưa có lịch sử để xuất", "error"); return; }
        let csv = "Time,Mail,Device ID\n";
        currentHistory.forEach(log => {
            const time = log.timestamp ? new Date(log.timestamp).toISOString() : '';
            csv += `"${time}","${log.mail || ''}","${log.deviceId || ''}"\n`;
        });
        downloadFile("\uFEFF" + csv, "history_" + currentRoom + ".csv", "text/csv;charset=utf-8;");
    }

    function exportMails() {
        if (currentAccounts.length === 0) { showToast("Không có mail để xuất", "error"); return; }
        downloadFile(currentAccounts.join("\n"), "mails_" + currentRoom + ".txt", "text/plain;charset=utf-8;");
    }

    function downloadFile(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Đã xuất: " + filename, "success");
    }

    document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "k") {
            const input = document.getElementById("roomInput");
            if (!document.getElementById("homeView").classList.contains("hidden")) {
                e.preventDefault();
                input.focus();
            }
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            if (!document.getElementById("mainView").classList.contains("hidden")) {
                e.preventDefault();
                const myMail = localStorage.getItem("my_mail_" + currentRoom);
                if (myMail) copyCurrentAgain();
                else copyMail(false);
            }
        }
    });

    document.getElementById("roomInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") goToRoom();
    });

    window.addEventListener("hashchange", init);
    init();
</script>

</body>
</html>
